name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Phiên bản phát hành (ví dụ: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
  push:
    branches:
      - main
      - feature/android-compact-pwa
      - feature/simple-shop-debts-offline
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taphoa-pro-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions Secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/taphoa-release.jks
          test -s android/app/taphoa-release.jks
          cat > android/ci-signing.gradle <<'GRADLE'
          allprojects { appProject ->
              appProject.plugins.withId('com.android.application') {
                  def androidComponents = appProject.extensions.findByName('androidComponents')
                  if (androidComponents == null) {
                      throw new GradleException("Android Components extension was not found")
                  }
                  androidComponents.finalizeDsl { androidExtension ->
                      def releaseSigning = androidExtension.signingConfigs.create('ciRelease')
                      releaseSigning.storeFile = appProject.file('taphoa-release.jks')
                      releaseSigning.storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      releaseSigning.keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                      releaseSigning.keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
                      androidExtension.buildTypes.getByName('release').signingConfig = releaseSigning
                  }
              }
          }
          GRADLE

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -I ci-signing.gradle

      - name: Verify release APK signature
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: taphoa-pro-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          name: Tạp hóa Pro v${{ inputs.release_version }}
          target_commitish: main
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
